services:

    shopware:
      image: dockware/dev:6.6.10.4
      container_name: shopware
      ports:
         - "80:80"
         - "3306:3306"
         - "22:22"
         - "8888:8888"
         - "9999:9999"
         - "9998:9998"
      volumes:
         - '.:/var/www/html/custom/plugins/NetzkollektivBccMailer'
      networks:
         - web
      environment:
         - XDEBUG_ENABLED=1

networks:
  web:
    external: false
